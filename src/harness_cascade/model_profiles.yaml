# Provider/model capabilities, as published by the provider.
#
# context_window and max_output_tokens are the vendor's own figures and are only
# the fallback: limits.discover_model_limits asks the provider at run time and
# prefers what it answers. Omit either key rather than estimating it -- the code
# falls back to a value known to work everywhere, which beats a guess.
#
# Sources, September 2026: developers.openai.com model pages, Anthropic's
# models overview, DeepSeek's and Together's model pages, and Pi's model
# catalog (pi.dev/models) for what Together serves. Together counts input and
# output against one window; the gateway lowers the output limit to fit.
#
# Effort ladders for the Together deployments were measured, not published; see
# docs/reasoning-effort.md for the per-level reasoning-token counts and for the
# values each endpoint rejects or silently aliases.

version: 1

providers:
  openai:
    protocol: openai-responses
    models:
      gpt-6-astra:
        context_window: 1050000
        max_output_tokens: 128000
        efforts: [low, medium, high, xhigh, max]
      gpt-5.6:
